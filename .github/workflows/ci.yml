name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meridian_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meridian_test
      MASTER_MNEMONIC: test test test test test test test test test test test junk
      USDC_MINT: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
      SOLANA_CLUSTER: mainnet-beta
      SOL_PRICE_USD: '75'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: postgres client 18
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          test -x /usr/lib/postgresql/18/bin/pg_dump
      - run: npm ci
      - run: npm run build
      - run: npx tsx scripts/check-migrations.ts
      - run: npm run migrate
      - name: schema drift
        run: |
          set -o pipefail
          PGDUMP=/usr/lib/postgresql/18/bin/pg_dump
          "$PGDUMP" --version
          "$PGDUMP" --schema-only --no-owner --no-privileges --no-comments --no-tablespaces "$DATABASE_URL" \
            | sed -e '/^SET /,$!d' -e '/restrict /d' > /tmp/actual.sql
          wc -l /tmp/actual.sql db/schema.sql
          if ! diff -u db/schema.sql /tmp/actual.sql > /tmp/delta.txt; then
            echo "::error::actual=$(wc -l < /tmp/actual.sql) lines snapshot=$(wc -l < db/schema.sql) | head: $(head -n 12 /tmp/actual.sql | tr '\n' '~') | delta: $(head -n 40 /tmp/delta.txt | tr '\n' '~')"
            exit 1
          fi
      - run: npm test
